name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aiga
          POSTGRES_USER: aiga
          POSTGRES_PASSWORD: aiga_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aiga
          SPRING_DATASOURCE_USERNAME: aiga
          SPRING_DATASOURCE_PASSWORD: aiga_test_password