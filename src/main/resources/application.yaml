spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: aiga
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiga}
    username: ${SPRING_DATASOURCE_USERNAME:aiga}
    password: ${SPRING_DATASOURCE_PASSWORD:aiga_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:aiga-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
